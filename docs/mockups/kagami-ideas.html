<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鏡の結界の新案</title>
<style>
  :root { --kaya:#E2B65B; --kayaL:#F2D594; --sumi:#1d1a17; --gofun:#EEE8DC; --wana:#D7263D; --mahou:#2B59C3; --soubi:#C9A227; --yoru:#14213d; }
  body { margin:0; background:#241a12; color:var(--gofun); font-family:"Shippori Mincho B1","Yu Mincho",serif; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .lead { margin:0 0 20px; font-size:13px; opacity:.75; }
  section { margin:0 0 28px; }
  h2 { font-size:17px; margin:0 0 4px; display:flex; gap:10px; align-items:baseline; }
  h2 small { font-size:12px; opacity:.7; font-weight:400; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  figure { margin:0; background:#120d09; border-radius:6px; overflow:hidden; }
  figure svg { display:block; width:100%; height:auto; }
  figcaption { font-size:12px; padding:6px 8px 8px; line-height:1.45; }
  .rec { color:var(--kaya); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>鏡の結界の新案（絵コンテ）</h1>
  <p class="lead">3案を3つの場面で描いたイメージです。札の字は反転させずに読める向きで見せ、光の柱は使いません。</p>

  <section>
    <h2>A　水鏡 <small class="rec">おすすめ</small></h2>
    <div class="row">
      <figure>
        <svg viewBox="0 0 200 240">
          <defs>
            <linearGradient id="wA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3a66"/><stop offset="1" stop-color="#0b1a33"/></linearGradient>
          </defs>
          <rect width="200" height="240" fill="#0d0a08"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="url(#wA)"/>
          <!-- 映り込んだ提灯 -->
          <g opacity=".5">
            <ellipse cx="65" cy="150" rx="7" ry="12" fill="#f2d594"/><ellipse cx="100" cy="150" rx="7" ry="12" fill="#f2d594"/><ellipse cx="135" cy="150" rx="7" ry="12" fill="#f2d594"/>
          </g>
          <g stroke="#aec4ef" stroke-opacity=".35" fill="none"><path d="M30 180 Q100 170 170 180"/><path d="M45 130 Q100 124 155 130"/></g>
          <text x="100" y="38" text-anchor="middle" fill="#EEE8DC" font-size="12">盤がしんと静まった水面に</text>
        </svg>
        <figcaption>暗転。盤の面が一瞬で静かな水面に変わる。提灯や駒が逆さに映る</figcaption>
      </figure>
      <figure>
        <svg viewBox="0 0 200 240">
          <rect width="200" height="240" fill="#0d0a08"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="#122a4d"/>
          <!-- 札（読める向き） -->
          <g transform="translate(78 42) rotate(-6)">
            <rect width="44" height="64" rx="3" fill="#EEE8DC" stroke="#2B59C3" stroke-width="3"/>
            <text x="22" y="26" text-anchor="middle" font-size="13" fill="#1d1a17">落</text><text x="22" y="42" text-anchor="middle" font-size="13" fill="#1d1a17">雷</text>
          </g>
          <!-- 水面の映り（ぼやけて揺れる） -->
          <g transform="translate(80 150) scale(1 -.55)" opacity=".35"><rect width="44" height="64" rx="3" fill="#EEE8DC"/></g>
          <ellipse cx="100" cy="150" rx="26" ry="5" fill="none" stroke="#aec4ef" stroke-opacity=".6"/>
        </svg>
        <figcaption>相手の札がそのままの向きで落ちてくる。水面に札の影が映る</figcaption>
      </figure>
      <figure>
        <svg viewBox="0 0 200 240">
          <rect width="200" height="240" fill="#0d0a08"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="#122a4d"/>
          <g fill="none" stroke="#EEE8DC">
            <ellipse cx="100" cy="150" rx="22" ry="6" stroke-opacity=".9"/>
            <ellipse cx="100" cy="150" rx="46" ry="12" stroke-opacity=".6"/>
            <ellipse cx="100" cy="150" rx="72" ry="19" stroke-opacity=".35"/>
            <ellipse cx="100" cy="150" rx="96" ry="26" stroke-opacity=".18"/>
          </g>
          <!-- 半分沈んで溶ける札 -->
          <g transform="translate(80 118)"><rect width="40" height="30" fill="#EEE8DC" opacity=".55"/></g>
          <g fill="#aec4ef"><circle cx="92" cy="112" r="2"/><circle cx="110" cy="104" r="1.6"/><circle cx="101" cy="98" r="1.2"/></g>
          <text x="100" y="38" text-anchor="middle" fill="#EEE8DC" font-size="12">ちゃぽん……</text>
        </svg>
        <figcaption>触れた瞬間、波紋が盤じゅうに広がり、札は水に沈んで溶ける。最後に水面が盤に戻る</figcaption>
      </figure>
    </div>
  </section>

  <section>
    <h2>B　注連縄の結界</h2>
    <div class="row">
      <figure>
        <svg viewBox="0 0 200 240">
          <rect width="200" height="240" fill="#0d0a08"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="#c99a45"/>
          <path d="M18 128 Q100 150 182 128" stroke="#b08a3a" stroke-width="9" fill="none"/>
          <path d="M18 128 Q100 150 182 128" stroke="#e8d08a" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
          <g fill="#EEE8DC" stroke="#bbb" stroke-width=".5">
            <path d="M55 137 l6 0 l-4 8 l6 0 l-4 9 l6 0"/><path d="M95 142 l6 0 l-4 8 l6 0 l-4 9 l6 0"/><path d="M135 137 l6 0 l-4 8 l6 0 l-4 9 l6 0"/>
          </g>
          <text x="100" y="38" text-anchor="middle" fill="#EEE8DC" font-size="12">ビシッ</text>
        </svg>
        <figcaption>守る側の陣の前に、紙垂の付いた注連縄が端から端へビシッと張られる</figcaption>
      </figure>
      <figure>
        <svg viewBox="0 0 200 240">
          <rect width="200" height="240" fill="#0d0a08"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="#c99a45"/>
          <path d="M18 128 Q100 146 182 128" stroke="#b08a3a" stroke-width="9" fill="none"/>
          <g transform="translate(78 82) rotate(8)">
            <rect width="44" height="64" rx="3" fill="#EEE8DC" stroke="#2B59C3" stroke-width="3"/>
            <text x="22" y="26" text-anchor="middle" font-size="13" fill="#1d1a17">落</text><text x="22" y="42" text-anchor="middle" font-size="13" fill="#1d1a17">雷</text>
          </g>
          <g stroke="#f2c230" stroke-width="2"><path d="M100 138 l-18 -10"/><path d="M100 138 l20 -12"/><path d="M100 138 l-6 -20"/><path d="M100 138 l10 -18"/></g>
        </svg>
        <figcaption>飛んできた札が縄にぶつかって止まり、火花が散る</figcaption>
      </figure>
      <figure>
        <svg viewBox="0 0 200 240">
          <rect width="200" height="240" fill="#0d0a08"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="#c99a45"/>
          <path d="M18 128 Q100 150 182 128" stroke="#b08a3a" stroke-width="9" fill="none"/>
          <g transform="translate(62 76) rotate(-24)"><rect width="22" height="60" fill="#EEE8DC" stroke="#2B59C3" stroke-width="2"/></g>
          <g transform="translate(118 70) rotate(22)"><rect width="22" height="60" fill="#EEE8DC" stroke="#2B59C3" stroke-width="2"/></g>
          <path d="M100 60 L100 130" stroke="#EEE8DC" stroke-width="2" stroke-dasharray="3 3"/>
        </svg>
        <figcaption>紙垂がひるがえって札を真っ二つに切り裂く。縄はするっとほどけて消える</figcaption>
      </figure>
    </div>
  </section>

  <section>
    <h2>C　天の八咫鏡</h2>
    <div class="row">
      <figure>
        <svg viewBox="0 0 200 240">
          <rect width="200" height="240" fill="#0d0a08"/>
          <circle cx="100" cy="40" r="26" fill="#C9A227"/><circle cx="100" cy="40" r="19" fill="#fff1bf"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="#8a6a2a"/>
        </svg>
        <figcaption>暗い空に大きな鏡が現れる</figcaption>
      </figure>
      <figure>
        <svg viewBox="0 0 200 240">
          <rect width="200" height="240" fill="#3a2a10"/>
          <circle cx="100" cy="40" r="26" fill="#C9A227"/><circle cx="100" cy="40" r="19" fill="#fffbe8"/>
          <polygon points="85,60 115,60 150,215 50,215" fill="#fff1bf" opacity=".35"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="#E2B65B" opacity=".9"/>
          <g transform="translate(80 110)"><rect width="40" height="58" rx="3" fill="#EEE8DC" stroke="#2B59C3" stroke-width="3"/><text x="20" y="24" text-anchor="middle" font-size="12" fill="#1d1a17">落</text><text x="20" y="40" text-anchor="middle" font-size="12" fill="#1d1a17">雷</text></g>
        </svg>
        <figcaption>舞台が夜明けのような金色に照らされ、札が光に捕まる</figcaption>
      </figure>
      <figure>
        <svg viewBox="0 0 200 240">
          <rect width="200" height="240" fill="#3a2a10"/>
          <polygon points="40,90 160,90 185,215 15,215" fill="#E2B65B" opacity=".9"/>
          <g transform="translate(80 110)"><rect width="40" height="30" fill="#EEE8DC" opacity=".5"/><path d="M0 30 Q10 22 20 30 Q30 38 40 30" stroke="#D7263D" stroke-width="2" fill="none"/></g>
          <g fill="#1d1a17"><circle cx="90" cy="98" r="2"/><circle cx="104" cy="88" r="1.5"/><circle cx="116" cy="96" r="2"/><circle cx="98" cy="78" r="1.3"/><circle cx="112" cy="70" r="1.6"/></g>
        </svg>
        <figcaption>光の中で札が端から燃えて、灰になって舞い上がる</figcaption>
      </figure>
    </div>
  </section>
</main>
</body>
</html>
