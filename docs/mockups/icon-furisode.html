<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アイコンの見比べ</title>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Shippori+Mincho+B1:wght@500;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2E1D14; color: #EEE8DC; font-family: "Shippori Mincho B1", serif; padding: 24px 16px 40px; }
  header { max-width: 960px; margin: 0 auto 18px; }
  h1 { font-family: "Yuji Boku", serif; font-weight: 400; font-size: 30px; letter-spacing: .08em; }
  header p { margin-top: 6px; font-size: 14px; line-height: 1.7; opacity: .85; }
  main { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px; }
  section { background: #f3eee2; color: #1d1a17; padding: 16px; border-radius: 3px; }
  h2 { font-family: "Yuji Boku", serif; font-weight: 400; font-size: 24px; margin-bottom: 12px; }
  .big { display: block; width: 100%; max-width: 240px; margin: 0 auto; border-radius: 22%; }
  .home { display: flex; justify-content: center; gap: 18px; margin-top: 14px; padding: 14px 0 8px; background: #6c7a96; border-radius: 6px; }
  .home figure { text-align: center; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 11px; color: #fff; }
  .home img { width: 60px; height: 60px; border-radius: 14px; display: block; margin-bottom: 4px; }
  p.note { margin-top: 12px; font-size: 13px; line-height: 1.75; }
</style></head>
<body>
<header>
  <h1>アイコンの見比べ</h1>
  <p>駒と「傾」はそのままに、後ろの地を振袖の柄にした2案。下の灰色の帯は、ホーム画面に並んだときの大きさ（60px）。</p>
</header>
<main>
  <section><h2>紅の振袖</h2><img class="big" src="icon-furisode/icon-beni-1024.png" alt="紅の振袖のアイコン">
    <div class="home"><figure><img src="icon-furisode/icon-beni-60.png" alt="">傾将棋</figure></div>
    <p class="note">紅の地に、藍の青海波と胡粉の麻の葉を金のふちの雲取りで区切り、胡粉の大輪の牡丹と桜を散らした。いちばん華やか。</p></section>
  <section><h2>黒の振袖</h2><img class="big" src="icon-furisode/icon-kuro-1024.png" alt="黒の振袖のアイコン">
    <div class="home"><figure><img src="icon-furisode/icon-kuro-60.png" alt="">傾将棋</figure></div>
    <p class="note">墨の地に金の流水と金の菊、紅と胡粉の桜、紅の青海波の雲取り。大人っぽく、駒の木の色がいちばん浮く。</p></section>
  <section><h2>いまの絵</h2><img class="big" src="icon-furisode/icon-yoru-1024.png" alt="いまのアイコン">
    <div class="home"><figure><img src="icon-furisode/icon-yoru-60.png" alt="">傾将棋</figure></div>
    <p class="note">夜の藍の地に紅の隈取の一筆。</p></section>
</main>
</body></html>
