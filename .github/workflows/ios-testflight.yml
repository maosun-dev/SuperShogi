# iPhone版をGitHubのMacで組み立てて、TestFlightに送る。
# GitHubのリポジトリの「Actions」タブ →「iPhone版をTestFlightへ」→「Run workflow」で動く。
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   APPLE_TEAM_ID              Appleのチーム ID（10文字）
#   APPSTORE_API_KEY_ID        App Store Connect API キーの Key ID
#   APPSTORE_API_ISSUER_ID     App Store Connect API キーの Issuer ID
#   APPSTORE_API_PRIVATE_KEY   ダウンロードした AuthKey_XXXX.p8 の中身（全文）
#   SFX_KEY                    素材の効果音の鍵（手元の tools/sfx/sfx.key の中身）
name: iPhone版をTestFlightへ

on:
  workflow_dispatch:
    inputs:
      runner:
        description: '組み立てに使う Mac（新しいチップの Mac は混んでいて始まらないことがある）'
        type: choice
        options: [macos-15-intel, macos-latest]
        default: macos-15-intel

permissions:
  contents: read

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
    steps:
      # 外の部品はコミット番号で固定する（名札 @v4 などは差し替えられて鍵を盗まれる道になるため）。
      # 版を上げるときは、新しい版の番号を確かめてから書き換える
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # 素材の効果音は再配布できないので、鍵をかけたファイルだけをリポジトリに置いている
      - name: 素材の効果音を戻す
        env:
          SFX_KEY: ${{ secrets.SFX_KEY }}
        run: node tools/sfx/lock.mjs unlock

      - name: ゲームのファイルをアプリに入れる
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: App Store Connect の鍵を置く
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      # ここでは署名しない（署名すると開発用の証明書が要り、それには iPhone の登録が要る）。
      # 配布用の署名は次の「TestFlight に送る」で付ける。
      - name: アプリを組み立てる（archive）
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
          # 署名なしの部品は送るときに署名し直されないので、仮の署名を付けておく（送るときに配布用に置き換わる）
          if [ -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Frameworks" ]; then
            find "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Frameworks" -maxdepth 1 -name '*.framework' \
              -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none \
            "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"

      - name: TestFlight に送る
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 鍵を消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
